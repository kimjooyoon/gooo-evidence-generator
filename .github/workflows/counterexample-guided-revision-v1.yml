name: Counterexample-guided revision v1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  counterexample-guided-revision:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Bind exact subject and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "SUBJECT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          snapshot > "$RUNNER_TEMP/repository-before"

      - name: Acquire pinned released Gooo
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/core-release-lock-v1.json
          tag=$(jq -r '.tag' "$lock")
          expected_tag_object=$(jq -r '.tag_object_sha' "$lock")
          expected_target=$(jq -r '.target_commit_sha' "$lock")
          asset_name=$(jq -r '.assets[0].name' "$lock")
          expected_digest=$(jq -r '.assets[0].sha256' "$lock")

          gh api "repos/kimjooyoon/meta-ontology-go/git/ref/tags/$tag" > "$RUNNER_TEMP/tag-ref.json"
          jq -e --arg sha "$expected_tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/tag-ref.json" >/dev/null
          gh api "repos/kimjooyoon/meta-ontology-go/git/tags/$expected_tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq -e --arg sha "$expected_target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/tag-object.json" >/dev/null
          gh api "repos/kimjooyoon/meta-ontology-go/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          asset_id=$(jq -r --arg name "$asset_name" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/release.json")
          test -n "$asset_id"
          archive="$RUNNER_TEMP/$asset_name"
          gh api -H 'Accept: application/octet-stream' "repos/kimjooyoon/meta-ontology-go/releases/assets/$asset_id" > "$archive"
          printf '%s  %s\n' "$expected_digest" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gooo"
          echo "GOOO_BIN=$RUNNER_TEMP/gooo" >> "$GITHUB_ENV"

      - name: Bind twelve released revision activities
        shell: bash
        run: |
          set -euo pipefail
          source_file=examples/counterexample-guided-revision/main.gooo
          "$GOOO_BIN" version --json > "$RUNNER_TEMP/version.json"
          "$GOOO_BIN" check --json "$source_file" > "$RUNNER_TEMP/syntax.json"
          "$GOOO_BIN" check --semantic --json "$source_file" > "$RUNNER_TEMP/semantic.json"
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/graph-rss" \
            "$GOOO_BIN" graph dump "$source_file" > "$RUNNER_TEMP/graph.json"
          jq -e '.schema_version=="gooo-version/v1" and .language=="gooo"' "$RUNNER_TEMP/version.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok"' "$RUNNER_TEMP/syntax.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok" and .semantic_hash!=null' "$RUNNER_TEMP/semantic.json" >/dev/null
          jq -e '.schema_version=="gooo-graph/v1" and .ir.status=="available"' "$RUNNER_TEMP/graph.json" >/dev/null

          jq -S '{schema:"gooo/evidence-generator/activity-selector-set/v1",role:"project_graph",
            selectors:[.cells[]|{ordinal,id,activity,selector:{name:.activity}}]}' \
            contracts/counterexample-guided-revision-denominator-v1.json > "$RUNNER_TEMP/revision-selectors.json"
          bash scripts/bind-activity-resolutions.sh \
            "$GOOO_BIN" "$source_file" "$RUNNER_TEMP/graph.json" \
            "$RUNNER_TEMP/revision-selectors.json" contracts/core-release-lock-v1.json \
            "$RUNNER_TEMP/resolved-activities.json" project_graph
          jq -e '.activity_resolution_observation.summary=={expected:12,observed:12,closed:12,unknown:0,refuted:0,unique_selectors:12}' "$RUNNER_TEMP/resolved-activities.json" >/dev/null

      - name: Generate revision proposals and causal frontiers
        shell: bash
        run: |
          set -euo pipefail
          denominator=contracts/counterexample-guided-revision-denominator-v1.json
          claim=contracts/counterexample-guided-revision-claim-v1.json
          proposal=contracts/counterexample-guided-revision-proposal-v1.json
          evidence=fixtures/counterexample-guided-revision/evidence.json
          resolution="$RUNNER_TEMP/resolved-activities.json"
          evaluator=scripts/evaluate-counterexample-guided-revision-v1.sh
          conformer=scripts/conform-counterexample-guided-revision-v1.sh

          mkdir -p "$RUNNER_TEMP/scenarios"
          jq 'del(.observation.claim_present)' "$evidence" > "$RUNNER_TEMP/scenarios/direct-missing.json"
          jq '.observation.dependencies[0].state="UNKNOWN"' "$evidence" > "$RUNNER_TEMP/scenarios/dependency-blocked.json"
          jq '.observation.fresh=false' "$evidence" > "$RUNNER_TEMP/scenarios/stale.json"
          jq '.observation.scope_unambiguous=false' "$evidence" > "$RUNNER_TEMP/scenarios/ambiguous.json"
          jq '.observation.frontier_bounded=false' "$evidence" > "$RUNNER_TEMP/scenarios/unbounded.json"
          jq '.counterexample={present:true,kind:"SEMANTIC_CONTRADICTION",expected:{resolution:"MEDIUM"},observed:{resolution:"HIGH"}}' "$evidence" > "$RUNNER_TEMP/scenarios/counterexample.json"
          jq 'del(.observation)' "$evidence" > "$RUNNER_TEMP/scenarios/malformed.json"
          jq '.upper_decision="FIXED_POINT"' "$evidence" > "$RUNNER_TEMP/scenarios/fixed-point.json"
          jq '.upper_decision="MYSTERY"' "$evidence" > "$RUNNER_TEMP/scenarios/unrecognized-decision.json"
          jq '.observation.fresh=false | .counterexample={present:true,kind:"SEMANTIC_CONTRADICTION",expected:{resolution:"MEDIUM"},observed:{resolution:"HIGH"}}' "$evidence" > "$RUNNER_TEMP/scenarios/mixed.json"

          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/evaluator-rss" \
            bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$evidence" "$resolution" \
              "$RUNNER_TEMP/normal-a" "$SUBJECT_SHA" normal
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$RUNNER_TEMP/evaluator-wall-ms"
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$evidence" "$resolution" \
            "$RUNNER_TEMP/normal-b" "$SUBJECT_SHA" normal
          diff -qr "$RUNNER_TEMP/normal-a" "$RUNNER_TEMP/normal-b"

          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/direct-missing.json" "$resolution" \
            "$RUNNER_TEMP/direct-missing" "$SUBJECT_SHA" direct-missing
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/dependency-blocked.json" "$resolution" \
            "$RUNNER_TEMP/dependency-blocked" "$SUBJECT_SHA" dependency-blocked
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/stale.json" "$resolution" \
            "$RUNNER_TEMP/stale" "$SUBJECT_SHA" stale
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/ambiguous.json" "$resolution" \
            "$RUNNER_TEMP/ambiguous" "$SUBJECT_SHA" ambiguous
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/unbounded.json" "$resolution" \
            "$RUNNER_TEMP/unbounded" "$SUBJECT_SHA" unbounded
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/counterexample.json" "$resolution" \
            "$RUNNER_TEMP/counterexample" "$SUBJECT_SHA" counterexample
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/malformed.json" "$resolution" \
            "$RUNNER_TEMP/malformed" "$SUBJECT_SHA" malformed
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/fixed-point.json" "$resolution" \
            "$RUNNER_TEMP/fixed-point" "$SUBJECT_SHA" fixed-point
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/unrecognized-decision.json" "$resolution" \
            "$RUNNER_TEMP/unrecognized-decision" "$SUBJECT_SHA" unrecognized-decision
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/mixed.json" "$resolution" \
            "$RUNNER_TEMP/mixed" "$SUBJECT_SHA" mixed

          bash "$conformer" "$RUNNER_TEMP/normal-a" "$denominator" "$claim" "$proposal" "$evidence" "$resolution" normal "$RUNNER_TEMP/conform-normal-a.json"
          bash "$conformer" "$RUNNER_TEMP/normal-b" "$denominator" "$claim" "$proposal" "$evidence" "$resolution" normal "$RUNNER_TEMP/conform-normal-b.json"
          bash "$conformer" "$RUNNER_TEMP/direct-missing" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/direct-missing.json" "$resolution" direct-missing "$RUNNER_TEMP/conform-direct-missing.json"
          bash "$conformer" "$RUNNER_TEMP/dependency-blocked" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/dependency-blocked.json" "$resolution" dependency-blocked "$RUNNER_TEMP/conform-dependency-blocked.json"
          bash "$conformer" "$RUNNER_TEMP/stale" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/stale.json" "$resolution" stale "$RUNNER_TEMP/conform-stale.json"
          bash "$conformer" "$RUNNER_TEMP/ambiguous" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/ambiguous.json" "$resolution" ambiguous "$RUNNER_TEMP/conform-ambiguous.json"
          bash "$conformer" "$RUNNER_TEMP/unbounded" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/unbounded.json" "$resolution" unbounded "$RUNNER_TEMP/conform-unbounded.json"
          bash "$conformer" "$RUNNER_TEMP/counterexample" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/counterexample.json" "$resolution" counterexample "$RUNNER_TEMP/conform-counterexample.json"
          bash "$conformer" "$RUNNER_TEMP/malformed" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/malformed.json" "$resolution" malformed "$RUNNER_TEMP/conform-malformed.json"
          bash "$conformer" "$RUNNER_TEMP/fixed-point" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/fixed-point.json" "$resolution" fixed-point "$RUNNER_TEMP/conform-fixed-point.json"
          bash "$conformer" "$RUNNER_TEMP/unrecognized-decision" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/unrecognized-decision.json" "$resolution" unrecognized-decision "$RUNNER_TEMP/conform-unrecognized-decision.json"
          bash "$conformer" "$RUNNER_TEMP/mixed" "$denominator" "$claim" "$proposal" "$RUNNER_TEMP/scenarios/mixed.json" "$resolution" mixed "$RUNNER_TEMP/conform-mixed.json"

      - name: Record exact runtime inventory and authority
        shell: bash
        run: |
          set -euo pipefail
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          before=$(cat "$RUNNER_TEMP/repository-before")
          after=$(snapshot)
          if [ "$before" = "$after" ]; then repository_writes=0; else repository_writes=1; fi

          descendant_dirs=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -mindepth 1 -type d -print | wc -l | tr -d ' ')
          regular_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f ! -path "$GITHUB_WORKSPACE/README.md" -print | wc -l | tr -d ' ')
          physical_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f ! -path "$GITHUB_WORKSPACE/README.md" -print0 | sort -z | xargs -0 cat | wc -l | tr -d ' ')
          go_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -print | wc -l | tr -d ' ')
          gooo_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -print | wc -l | tr -d ' ')
          go_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -print0 | sort -z | xargs -0 -r cat | wc -l | tr -d ' ')
          gooo_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -print0 | sort -z | xargs -0 -r cat | wc -l | tr -d ' ')
          language_files=$(
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f \( -name '*.go' -o -name '*.gooo' \) -print0 |
              sort -z | while IFS= read -r -d '' file; do
                relative=${file#"$GITHUB_WORKSPACE/"}
                case "$file" in *.gooo) language=Gooo ;; *) language=Go ;; esac
                jq -cn --arg language "$language" --arg path "$relative" --argjson physical_lines "$(wc -l < "$file" | tr -d ' ')" \
                  '{language:$language,path:$path,physical_lines:$physical_lines}'
              done | jq -s .
          )

          go_version=$(go env GOVERSION)
          evaluator_wall_ms=$(cat "$RUNNER_TEMP/evaluator-wall-ms")
          evaluator_peak_rss_kib=$(cat "$RUNNER_TEMP/evaluator-rss")
          graph_peak_rss_kib=$(cat "$RUNNER_TEMP/graph-rss")
          jq -S -n \
            --arg subject_sha "$SUBJECT_SHA" \
            --arg before "$before" --arg after "$after" --arg go_version "$go_version" \
            --argjson repository_writes "$repository_writes" \
            --argjson descendant_dirs "$descendant_dirs" --argjson regular_files "$regular_files" \
            --argjson physical_lines "$physical_lines" --argjson go_files "$go_files" \
            --argjson gooo_files "$gooo_files" --argjson go_lines "$go_lines" \
            --argjson gooo_lines "$gooo_lines" --argjson language_files "$language_files" \
            --argjson evaluator_wall_ms "$evaluator_wall_ms" --argjson evaluator_peak_rss_kib "$evaluator_peak_rss_kib" \
            --argjson graph_peak_rss_kib "$graph_peak_rss_kib" '
            {schema:"gooo/evidence-generator/counterexample-guided-revision/runtime/v1",subject_sha:$subject_sha,
             toolchain:{go:$go_version,go_required:"go1.27.0",released_gooo_reuse:1},
             executions:{gooo_version:1,gooo_syntax_check:1,gooo_semantic_check:1,gooo_graph:1,
               revision_evaluator:12,conformer:12,replay_runs:2,go_build:0,go_test:0,
               product_build:0,product_test:0,local_test:0},
             performance:{normal_evaluator_wall_ms:$evaluator_wall_ms,normal_evaluator_peak_rss_kib:$evaluator_peak_rss_kib,
               gooo_graph_peak_rss_kib:$graph_peak_rss_kib},
             inventory:{root_readme_policy:"EXCLUDED",input_descendant_dirs:$descendant_dirs,
               input_regular_files:$regular_files,input_physical_lines:$physical_lines,
               input_go_files:$go_files,input_go_physical_lines:$go_lines,
               input_gooo_files:$gooo_files,input_gooo_physical_lines:$gooo_lines,language_files:$language_files},
             repository:{before_digest:$before,after_digest:$after,writes:$repository_writes},
             cases:{normal:1,unknown:5,refuted:5,normal_replay_runs:2},
             revision:{input_claim_promoted:false,exact_before_after:{state:"UNKNOWN",observed:0,required:1},
               source_mutations:0,repository_writes:0},
             artifacts:{scenario_outputs:12,scenario_files:84,conformer_reports:12,total:102}}
          ' > "$RUNNER_TEMP/runtime.json"

          jq -e '.toolchain.go=="go1.27.0" and .repository.writes==0 and .executions.go_build==0 and .executions.go_test==0 and .executions.local_test==0 and .revision.input_claim_promoted==false and .revision.exact_before_after.state=="UNKNOWN" and .artifacts.total==102' "$RUNNER_TEMP/runtime.json" >/dev/null
          jq -e '.repository.writes==0 and .repository.before_digest==.repository.after_digest' "$RUNNER_TEMP/runtime.json" >/dev/null

          artifact_files=$(
            find "$RUNNER_TEMP/normal-a" "$RUNNER_TEMP/normal-b" "$RUNNER_TEMP/direct-missing" "$RUNNER_TEMP/dependency-blocked" \
              "$RUNNER_TEMP/stale" "$RUNNER_TEMP/ambiguous" "$RUNNER_TEMP/unbounded" "$RUNNER_TEMP/counterexample" \
              "$RUNNER_TEMP/malformed" "$RUNNER_TEMP/fixed-point" "$RUNNER_TEMP/unrecognized-decision" "$RUNNER_TEMP/mixed" -type f
            find "$RUNNER_TEMP" -maxdepth 1 -name 'conform-*.json' -type f
            printf '%s\n' "$RUNNER_TEMP/runtime.json" "$RUNNER_TEMP/version.json" "$RUNNER_TEMP/syntax.json" "$RUNNER_TEMP/semantic.json" "$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/resolved-activities.json"
          )
          test "$(printf '%s\n' "$artifact_files" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 102

          {
            echo '## Counterexample-guided revision v1'
            jq -r '"- normal proposal: \(.decision); cells \(.summary.closed) CLOSED / \(.summary.unknown) UNKNOWN / \(.summary.refuted) REFUTED; input claim promoted \(.input_claim_promoted)",
              "- improvement: \(.improvement_claim.state) (exact before/after pair absent)",
              "- causal frontier: \(.claim.state) \(.claim.stage)/\(.claim.step) \(.claim.unknown_class // \"NONE\")"' "$RUNNER_TEMP/normal-a/evaluation.json"
            jq -r '"- scenarios: normal 1; UNKNOWN 5; REFUTED 5; replay 2", "- evaluator: \(.performance.normal_evaluator_wall_ms) ms / \(.performance.normal_evaluator_peak_rss_kib) KiB peak RSS", "- inventory: Go \(.inventory.input_go_files) files / \(.inventory.input_go_physical_lines) lines; Gooo \(.inventory.input_gooo_files) files / \(.inventory.input_gooo_physical_lines) lines", "- tree: \(.inventory.input_regular_files) files; \(.inventory.input_descendant_dirs) descendant directories; root README \(.inventory.root_readme_policy)", "- artifacts: \(.artifacts.total)", "- repository writes: \(.repository.writes)"' "$RUNNER_TEMP/runtime.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload counterexample-guided revision evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: counterexample-guided-revision-v1-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/normal-a
            ${{ runner.temp }}/normal-b
            ${{ runner.temp }}/direct-missing
            ${{ runner.temp }}/dependency-blocked
            ${{ runner.temp }}/stale
            ${{ runner.temp }}/ambiguous
            ${{ runner.temp }}/unbounded
            ${{ runner.temp }}/counterexample
            ${{ runner.temp }}/malformed
            ${{ runner.temp }}/fixed-point
            ${{ runner.temp }}/unrecognized-decision
            ${{ runner.temp }}/mixed
            ${{ runner.temp }}/conform-normal-a.json
            ${{ runner.temp }}/conform-normal-b.json
            ${{ runner.temp }}/conform-direct-missing.json
            ${{ runner.temp }}/conform-dependency-blocked.json
            ${{ runner.temp }}/conform-stale.json
            ${{ runner.temp }}/conform-ambiguous.json
            ${{ runner.temp }}/conform-unbounded.json
            ${{ runner.temp }}/conform-counterexample.json
            ${{ runner.temp }}/conform-malformed.json
            ${{ runner.temp }}/conform-fixed-point.json
            ${{ runner.temp }}/conform-unrecognized-decision.json
            ${{ runner.temp }}/conform-mixed.json
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/version.json
            ${{ runner.temp }}/syntax.json
            ${{ runner.temp }}/semantic.json
            ${{ runner.temp }}/graph.json
            ${{ runner.temp }}/resolved-activities.json

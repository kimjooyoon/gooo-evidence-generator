name: Evidence generator conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Bind exact subject identity
        run: echo "SUBJECT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Observe and download released Gooo
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/core-release-lock-v1.json
          tag=$(jq -r '.tag' "$lock")
          expected_tag_object=$(jq -r '.tag_object_sha' "$lock")
          expected_target=$(jq -r '.target_commit_sha' "$lock")
          asset_name=$(jq -r '.assets[0].name' "$lock")
          expected_digest=$(jq -r '.assets[0].sha256' "$lock")

          gh api "repos/kimjooyoon/meta-ontology-go/git/ref/tags/$tag" > "$RUNNER_TEMP/tag-ref.json"
          jq -e --arg sha "$expected_tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/tag-ref.json" >/dev/null
          gh api "repos/kimjooyoon/meta-ontology-go/git/tags/$expected_tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq -e --arg sha "$expected_target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/tag-object.json" >/dev/null

          gh api "repos/kimjooyoon/meta-ontology-go/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          asset_id=$(jq -r --arg name "$asset_name" '.assets[] | select(.name==$name) | .id' "$RUNNER_TEMP/release.json")
          test -n "$asset_id"
          archive="$RUNNER_TEMP/$asset_name"
          gh api -H 'Accept: application/octet-stream' "repos/kimjooyoon/meta-ontology-go/releases/assets/$asset_id" > "$archive"
          printf '%s  %s\n' "$expected_digest" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gooo"
          echo "GOOO_BIN=$RUNNER_TEMP/gooo" >> "$GITHUB_ENV"

      - name: Observe released graph and source effect
        shell: bash
        run: |
          set -euo pipefail
          source_file=examples/self-hosted-generator/main.gooo
          external_source=examples/external-ledger/project.gooo
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          before=$(snapshot)
          printf '%s\n' "$before" > "$RUNNER_TEMP/repository-before"
          "$GOOO_BIN" version --json > "$RUNNER_TEMP/version.json"
          "$GOOO_BIN" check --json "$source_file" > "$RUNNER_TEMP/syntax.json"
          "$GOOO_BIN" check --semantic --json "$source_file" > "$RUNNER_TEMP/semantic.json"
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/graph-rss" \
            "$GOOO_BIN" graph dump "$source_file" > "$RUNNER_TEMP/graph.json"
          "$GOOO_BIN" check --json "$external_source" > "$RUNNER_TEMP/external-syntax.json"
          "$GOOO_BIN" check --semantic --json "$external_source" > "$RUNNER_TEMP/external-semantic.json"
          "$GOOO_BIN" graph dump "$external_source" > "$RUNNER_TEMP/external-graph.json"
          jq -e '.schema_version=="gooo-version/v1" and .language=="gooo"' "$RUNNER_TEMP/version.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok"' "$RUNNER_TEMP/syntax.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok" and .semantic_hash!=null' "$RUNNER_TEMP/semantic.json" >/dev/null
          jq -e '.schema_version=="gooo-graph/v1"' "$RUNNER_TEMP/graph.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok"' "$RUNNER_TEMP/external-syntax.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok" and .semantic_hash!=null' "$RUNNER_TEMP/external-semantic.json" >/dev/null
          jq -e '.schema_version=="gooo-graph/v1"' "$RUNNER_TEMP/external-graph.json" >/dev/null

          jq -S '
            [.patterns[]|select(.meta_activity!=null)] | to_entries |
            {schema:"gooo/evidence-generator/activity-selector-set/v1",role:"meta_graph",selectors:[.[]|{ordinal:(.key+1),id:.value.id,activity:.value.meta_activity,selector:{name:.value.meta_activity}}]}
          ' contracts/repetition-observation-v1.json > "$RUNNER_TEMP/meta-selectors.json"
          jq -S '{schema:"gooo/evidence-generator/activity-selector-set/v1",role:"project_graph",selectors:[.cells[]|{ordinal,id,activity,selector:{name:.activity}}]}' \
            contracts/evidence-generator-denominator-v1.json > "$RUNNER_TEMP/project-selectors.json"
          jq -S '{schema:"gooo/evidence-generator/activity-selector-set/v1",role:"project_graph",selectors:[.cells[]|{ordinal,id,activity,selector:{name:.activity}}]}' \
            contracts/external-ledger-denominator-v1.json > "$RUNNER_TEMP/external-selectors.json"
          binder=scripts/bind-activity-resolutions.sh
          core_lock=contracts/core-release-lock-v1.json
          bash "$binder" "$GOOO_BIN" "$source_file" "$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/meta-selectors.json" "$core_lock" "$RUNNER_TEMP/resolved-meta-graph.json" meta_graph
          bash "$binder" "$GOOO_BIN" "$source_file" "$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/project-selectors.json" "$core_lock" "$RUNNER_TEMP/resolved-project-graph.json" project_graph
          bash "$binder" "$GOOO_BIN" "$external_source" "$RUNNER_TEMP/external-graph.json" "$RUNNER_TEMP/external-selectors.json" "$core_lock" "$RUNNER_TEMP/resolved-external-graph.json" project_graph
          jq -e '.activity_resolution_observation.summary=={expected:11,observed:11,closed:11,unknown:0,refuted:0,unique_selectors:11}' "$RUNNER_TEMP/resolved-meta-graph.json" >/dev/null
          jq -e '.activity_resolution_observation.summary=={expected:12,observed:12,closed:12,unknown:0,refuted:0,unique_selectors:12}' "$RUNNER_TEMP/resolved-project-graph.json" "$RUNNER_TEMP/resolved-external-graph.json" >/dev/null

      - name: Generate complete and adversarial bundles
        shell: bash
        run: |
          set -euo pipefail
          denominator="$GITHUB_WORKSPACE/contracts/evidence-generator-denominator-v1.json"
          observation="$GITHUB_WORKSPACE/contracts/repetition-observation-v1.json"
          profile="$GITHUB_WORKSPACE/fixtures/self-hosted-generator/project.json"
          external_denominator="$GITHUB_WORKSPACE/contracts/external-ledger-denominator-v1.json"
          external_profile="$GITHUB_WORKSPACE/fixtures/external-ledger/project.json"

          jq -e '[.cells[]|select(.core_identity_anchor==true)]|length==1' "$denominator" "$external_denominator" >/dev/null

          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/generator-rss" \
            bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-project-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/complete-a" "$SUBJECT_SHA" complete
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns)/1000000 )) > "$RUNNER_TEMP/generator-wall-ms"
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-project-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/complete-b" "$SUBJECT_SHA" complete
          diff -qr "$RUNNER_TEMP/complete-a" "$RUNNER_TEMP/complete-b"
          bash scripts/verify.sh "$RUNNER_TEMP/complete-a" "$RUNNER_TEMP/verification.json"

          jq -e '
            .decision=="PROJECT_GENERATED" and
            .summary.closed==12 and .summary.unknown==0 and .summary.refuted==0 and
            .summary.direct_missing==0 and .summary.dependency_blocked==0 and
            .patterns.observed==12 and .patterns.support_eligible==12 and
            .patterns.meta_bound==11 and .patterns.promoted==11 and
            .patterns.excluded_without_meta==1 and .patterns.required==11 and
            .patterns.missing_required==0 and .patterns.unknown_required==0 and .patterns.refuted_required==0 and
            .authority.root_readme_readiness=="EXCLUDED" and
            .authority.activity_binding=="RELEASED_GOOO_ACTIVITY_RESOLUTION_RECEIPTS" and
            .core_resolution.identity_match and .core_resolution.identity_anchor_count==1 and .core_resolution.meta=={required:11,closed:11,unknown:0,refuted:0} and
            .core_resolution.project=={required:12,closed:12,unknown:0,refuted:0} and
            ([.indicators[]|select(.closed==.total)]|length)==3 and
            ([.proofs[]|select(.closed==4 and .total==4)]|length)==3 and
            .claim.state=="CLOSED"
          ' "$RUNNER_TEMP/complete-a/generation-report.json" >/dev/null
          jq -e '.tracked_file_count==6 and (.files|length)==6' "$RUNNER_TEMP/complete-a/generation-manifest.json" >/dev/null
          test "$(find "$RUNNER_TEMP/complete-a" -type f | wc -l)" -eq 7
          jq -e '.decision=="GENERATION_VERIFIED" and .summary.total==6 and .summary.closed==6 and .summary.unknown==0 and .summary.refuted==0 and .summary.actual_output_files==7' "$RUNNER_TEMP/verification.json" >/dev/null

          awk '!/^activity PublishGenerationReceipt\(/' examples/self-hosted-generator/main.gooo > "$RUNNER_TEMP/missing-source.gooo"
          "$GOOO_BIN" graph dump "$RUNNER_TEMP/missing-source.gooo" > "$RUNNER_TEMP/missing-graph.json"
          bash scripts/bind-activity-resolutions.sh "$GOOO_BIN" "$RUNNER_TEMP/missing-source.gooo" "$RUNNER_TEMP/missing-graph.json" "$RUNNER_TEMP/project-selectors.json" contracts/core-release-lock-v1.json "$RUNNER_TEMP/missing-resolved-project-graph.json" project_graph
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/missing-resolved-project-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/missing-activity" "$SUBJECT_SHA" missing-publish-activity
          jq -e '
            .decision=="INCOMPLETE" and .summary.closed==9 and .summary.unknown==3 and .summary.refuted==0 and
            .summary.direct_missing==1 and .summary.dependency_blocked==2 and
            .patterns.missing_required==0 and .patterns.unknown_required==0 and .patterns.refuted_required==0 and
            .claim.stage=="GENERATION" and .claim.step=="PUBLISH_GENERATION_RECEIPT" and
            .claim.reason=="GENERATION_RECEIPT_ACTIVITY_UNAVAILABLE" and
            .claim.unknown_class=="DIRECT_MISSING"
          ' "$RUNNER_TEMP/missing-activity/generation-report.json" >/dev/null

          jq '(.selectors[]|select(.id=="GENERATION_RECEIPT")|.selector)={namespace:"evidencegenerator"}' "$RUNNER_TEMP/project-selectors.json" > "$RUNNER_TEMP/ambiguous-project-selectors.json"
          bash scripts/bind-activity-resolutions.sh "$GOOO_BIN" examples/self-hosted-generator/main.gooo "$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/ambiguous-project-selectors.json" contracts/core-release-lock-v1.json "$RUNNER_TEMP/ambiguous-resolved-project-graph.json" project_graph
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/ambiguous-resolved-project-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/duplicate-activity" "$SUBJECT_SHA" ambiguous-publish-selector
          jq -e '
            .decision=="FAIL_CLOSED" and .summary.closed==9 and .summary.unknown==0 and .summary.refuted==3 and
            .patterns.missing_required==0 and .patterns.unknown_required==0 and .patterns.refuted_required==0 and
            .claim.stage=="GENERATION" and .claim.step=="PUBLISH_GENERATION_RECEIPT" and
            .claim.reason=="AMBIGUOUS_ACTIVITY_BINDING"
          ' "$RUNNER_TEMP/duplicate-activity/generation-report.json" >/dev/null

          jq '.required_patterns += ["root-readme"]' "$profile" > "$RUNNER_TEMP/unbound-profile.json"
          bash scripts/bind-activity-resolutions.sh "$GOOO_BIN" "$RUNNER_TEMP/missing-source.gooo" "$RUNNER_TEMP/missing-graph.json" "$RUNNER_TEMP/meta-selectors.json" contracts/core-release-lock-v1.json "$RUNNER_TEMP/missing-resolved-meta-graph.json" meta_graph
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/missing-resolved-meta-graph.json" "$RUNNER_TEMP/resolved-project-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/missing-meta-activity" "$SUBJECT_SHA" missing-meta-publish-activity
          jq -e '
            .decision=="INCOMPLETE" and .summary.closed==12 and .summary.unknown==0 and .summary.refuted==0 and
            .patterns.missing_required==1 and .patterns.unknown_required==1 and .patterns.refuted_required==0 and
            .claim.stage=="PROMOTION" and .claim.step=="OBSERVE_REQUIRED_PATTERN_ACTIVITY" and
            .claim.reason=="REQUIRED_PATTERN_ACTIVITY_UNAVAILABLE" and .claim.unknown_class=="DIRECT_MISSING"
          ' "$RUNNER_TEMP/missing-meta-activity/generation-report.json" >/dev/null

          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-project-graph.json" "$denominator" "$observation" "$RUNNER_TEMP/unbound-profile.json" "$RUNNER_TEMP/unbound-pattern" "$SUBJECT_SHA" unbound-required-pattern
          jq -e '
            .decision=="FAIL_CLOSED" and .summary.closed==12 and .summary.unknown==0 and .summary.refuted==0 and
            .patterns.missing_required==1 and .patterns.missing_required_ids==["root-readme"] and
            .patterns.unknown_required==0 and .patterns.refuted_required==1 and
            .claim.stage=="PROMOTION" and .claim.step=="REQUIRE_META_BOUND_PATTERN" and
            .claim.reason=="REQUIRED_PATTERN_NOT_PROMOTED"
          ' "$RUNNER_TEMP/unbound-pattern/generation-report.json" >/dev/null

          cp -R "$RUNNER_TEMP/complete-a" "$RUNNER_TEMP/generated-drift"
          printf '\n' >> "$RUNNER_TEMP/generated-drift/contracts/evidence-denominator-v1.json"
          bash scripts/verify.sh "$RUNNER_TEMP/generated-drift" "$RUNNER_TEMP/drift-verification.json"
          jq -e '
            .decision=="FAIL_CLOSED" and .summary.total==6 and .summary.closed==5 and .summary.refuted==1 and
            .claim.stage=="DIGEST" and .claim.step=="VERIFY_GENERATED_FILE_DIGEST" and
            .claim.reason=="GENERATED_FILE_DIGEST_MISMATCH"
          ' "$RUNNER_TEMP/drift-verification.json" >/dev/null

          jq 'del(.activity_resolution_observation.entries[7])' "$RUNNER_TEMP/resolved-project-graph.json" > "$RUNNER_TEMP/missing-core-receipt-graph.json"
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/missing-core-receipt-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/missing-core-receipt" "$SUBJECT_SHA" missing-core-resolution-receipt
          jq -e '.decision=="INCOMPLETE" and .summary.closed==9 and .summary.unknown==3 and .claim.stage=="RESOLUTION_OBSERVATION" and .claim.step=="BIND_CORE_ACTIVITY_RESOLUTION_RECEIPT" and .claim.reason=="CORE_ACTIVITY_RESOLUTION_RECEIPT_UNAVAILABLE"' "$RUNNER_TEMP/missing-core-receipt/generation-report.json" >/dev/null

          jq '(.activity_resolution_observation.entries[7].receipt.decision)="FIXED_POINT"' "$RUNNER_TEMP/resolved-project-graph.json" > "$RUNNER_TEMP/invalid-core-decision-graph.json"
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/invalid-core-decision-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/invalid-core-decision" "$SUBJECT_SHA" invalid-core-resolution-decision
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==9 and .summary.refuted==3 and .claim.stage=="RESOLUTION" and .claim.step=="RESOLVE_ACTIVITY_CARDINALITY" and .claim.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION"' "$RUNNER_TEMP/invalid-core-decision/generation-report.json" >/dev/null

          jq '(.activity_resolution_observation.core_release.tag)="v0.2.0-dev-mismatch"' "$RUNNER_TEMP/resolved-project-graph.json" > "$RUNNER_TEMP/core-identity-mismatch-graph.json"
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/core-identity-mismatch-graph.json" "$denominator" "$observation" "$profile" "$RUNNER_TEMP/core-identity-mismatch" "$SUBJECT_SHA" core-resolution-identity-mismatch
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==2 and .summary.refuted==10 and .core_resolution.identity_match==false and .core_resolution.identity_anchor_count==1 and .claim.stage=="CORE_RELEASE" and .claim.step=="BIND_CORE_RESOLUTION_RELEASE_IDENTITY" and .claim.reason=="CORE_RESOLUTION_RELEASE_IDENTITY_MISMATCH"' "$RUNNER_TEMP/core-identity-mismatch/generation-report.json" >/dev/null

          jq 'del(.cells[].core_identity_anchor)' "$denominator" > "$RUNNER_TEMP/missing-core-identity-anchor-denominator.json"
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-project-graph.json" "$RUNNER_TEMP/missing-core-identity-anchor-denominator.json" "$observation" "$profile" "$RUNNER_TEMP/missing-core-identity-anchor" "$SUBJECT_SHA" missing-core-identity-anchor
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==0 and .summary.refuted==12 and .core_resolution.identity_anchor_count==0 and .claim.stage=="DENOMINATOR" and .claim.step=="SELECT_CORE_IDENTITY_ANCHOR" and .claim.reason=="CORE_IDENTITY_ANCHOR_CARDINALITY_INVALID"' "$RUNNER_TEMP/missing-core-identity-anchor/generation-report.json" >/dev/null

          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-external-graph.json" "$external_denominator" "$observation" "$external_profile" "$RUNNER_TEMP/external-a" "$SUBJECT_SHA" external-ledger-complete
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-external-graph.json" "$external_denominator" "$observation" "$external_profile" "$RUNNER_TEMP/external-b" "$SUBJECT_SHA" external-ledger-complete
          diff -qr "$RUNNER_TEMP/external-a" "$RUNNER_TEMP/external-b"
          bash scripts/verify.sh "$RUNNER_TEMP/external-a" "$RUNNER_TEMP/external-verification.json"
          jq -e '
            .decision=="PROJECT_GENERATED" and .summary.closed==12 and .summary.unknown==0 and .summary.refuted==0 and
            .summary.meta_activity_nodes==12 and .summary.project_activity_nodes==12 and
            .patterns.promoted==11 and .patterns.missing_required==0 and
            .authority.pattern_activity_binding=="META_GRAPH" and .authority.cell_activity_binding=="PROJECT_GRAPH" and
            .subject.meta_graph_hash!=.subject.project_graph_hash and .claim.state=="CLOSED"
          ' "$RUNNER_TEMP/external-a/generation-report.json" >/dev/null
          jq -e '.decision=="GENERATION_VERIFIED" and .summary.closed==6 and .summary.total==6' "$RUNNER_TEMP/external-verification.json" >/dev/null

          jq '(.activity_resolution_observation.core_release.tag)="v0.2.0-dev-mismatch"' "$RUNNER_TEMP/resolved-external-graph.json" > "$RUNNER_TEMP/external-core-identity-mismatch-graph.json"
          bash scripts/generate.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/external-core-identity-mismatch-graph.json" "$external_denominator" "$observation" "$external_profile" "$RUNNER_TEMP/external-core-identity-mismatch" "$SUBJECT_SHA" external-ledger-core-identity-mismatch
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==8 and .summary.refuted==4 and .core_resolution.identity_match==false and .core_resolution.identity_anchor_count==1 and .claim.stage=="CORE_RELEASE" and .claim.step=="BIND_CORE_RESOLUTION_RELEASE_IDENTITY" and .claim.reason=="CORE_RESOLUTION_RELEASE_IDENTITY_MISMATCH"' "$RUNNER_TEMP/external-core-identity-mismatch/generation-report.json" >/dev/null

          compatibility_repository="$RUNNER_TEMP/local-ledger-lock-repository"
          mkdir -p "$compatibility_repository/contracts"
          jq -S -n \
            --slurpfile base "$GITHUB_WORKSPACE/contracts/core-release-lock-v1.json" \
            --slurpfile release "$RUNNER_TEMP/release.json" '
            ($base[0]) as $base |
            {
              schema:"gooo/local-ledger/core-release-lock/v1",
              repository:$base.repository,
              tag:$base.tag,
              tag_object_sha:$base.tag_object_sha,
              target_commit_sha:$base.target_commit_sha,
              assets:[$release[0].assets[] | {name:.name,digest:.digest,size:.size}]
            }
          ' > "$compatibility_repository/contracts/core-release-lock-v1.json"
          jq -e '.schema=="gooo/local-ledger/core-release-lock/v1" and (.assets|length)==8 and all(.assets[];.digest|test("^sha256:[0-9a-f]{64}$"))' "$compatibility_repository/contracts/core-release-lock-v1.json" >/dev/null
          bash scripts/generate.sh "$compatibility_repository" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-external-graph.json" "$external_denominator" "$observation" "$external_profile" "$RUNNER_TEMP/compatible-core-lock" "$SUBJECT_SHA" compatible-local-ledger-core-lock
          bash scripts/verify.sh "$RUNNER_TEMP/compatible-core-lock" "$RUNNER_TEMP/compatible-core-lock-verification.json"
          jq -e '.decision=="PROJECT_GENERATED" and .summary.closed==12 and .patterns.promoted==11' "$RUNNER_TEMP/compatible-core-lock/generation-report.json" >/dev/null
          jq -e '.schema=="gooo/local-ledger/core-release-lock/v1" and (.assets|length)==8 and all(.assets[];has("digest") and (has("sha256")|not))' "$RUNNER_TEMP/compatible-core-lock/contracts/core-release-lock-v1.json" >/dev/null
          jq -e '.decision=="GENERATION_VERIFIED" and .summary.closed==6 and .summary.total==6' "$RUNNER_TEMP/compatible-core-lock-verification.json" >/dev/null

          nested_repository="$RUNNER_TEMP/design-evidence-lock-repository"
          mkdir -p "$nested_repository/contracts"
          jq -S -n \
            --slurpfile base "$GITHUB_WORKSPACE/contracts/core-release-lock-v1.json" \
            --slurpfile release "$RUNNER_TEMP/release.json" '
            ($base[0]) as $base |
            {
              schema:"gooo/core-release-lock/v1",
              repository:$base.repository,
              release:{
                tag:$base.tag,
                tag_object:{type:"tag",sha:$base.tag_object_sha},
                target:{type:"commit",sha:$base.target_commit_sha},
                draft:false,prerelease:true,immutable:false,
                assets:[$release[0].assets[] | {name:.name,size:.size,digest:.digest}]
              },
              runtime:{platform:"linux-amd64",archive:"gooo-linux-amd64.tar.gz",
                checksums:"SHA256SUMS",version_schema:"gooo-version/v1",
                check_schema:"gooo/diagnostics/v1"}
            }
          ' > "$nested_repository/contracts/core-release-lock-v1.json"
          jq -e 'has("assets")|not' "$nested_repository/contracts/core-release-lock-v1.json" >/dev/null
          jq -e '.release.tag_object.type=="tag" and .release.target.type=="commit" and (.release.assets|length)==8' "$nested_repository/contracts/core-release-lock-v1.json" >/dev/null
          bash scripts/generate.sh "$nested_repository" "$RUNNER_TEMP/resolved-meta-graph.json" "$RUNNER_TEMP/resolved-external-graph.json" "$external_denominator" "$observation" "$external_profile" "$RUNNER_TEMP/nested-core-lock" "$SUBJECT_SHA" compatible-design-evidence-core-lock
          bash scripts/verify.sh "$RUNNER_TEMP/nested-core-lock" "$RUNNER_TEMP/nested-core-lock-verification.json"
          jq -e '.decision=="PROJECT_GENERATED" and .summary.closed==12 and .patterns.promoted==11' "$RUNNER_TEMP/nested-core-lock/generation-report.json" >/dev/null
          jq -e '(has("assets")|not) and .release.tag_object.type=="tag" and .release.target.type=="commit" and (.release.assets|length)==8' "$RUNNER_TEMP/nested-core-lock/contracts/core-release-lock-v1.json" >/dev/null
          jq -e '.decision=="GENERATION_VERIFIED" and .summary.closed==6 and .summary.total==6' "$RUNNER_TEMP/nested-core-lock-verification.json" >/dev/null

      - name: Publish exact indicators and enforce zero source writes
        shell: bash
        run: |
          set -euo pipefail
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          before=$(cat "$RUNNER_TEMP/repository-before")
          after=$(snapshot)
          if [ "$before" = "$after" ]; then writes=0; else writes=1; fi
          peak_rss_kib=$(cat "$RUNNER_TEMP/generator-rss")
          wall_ms=$(cat "$RUNNER_TEMP/generator-wall-ms")
          jq -S -n \
            --arg subject_sha "$SUBJECT_SHA" \
            --arg before "$before" \
            --arg after "$after" \
            --argjson writes "$writes" \
            --argjson peak_rss_kib "$peak_rss_kib" \
            --argjson wall_ms "$wall_ms" \
            --slurpfile report "$RUNNER_TEMP/complete-a/generation-report.json" \
            '{schema:"gooo/evidence-generator/runtime/v2",subject_sha:$subject_sha,
              generator:{peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms},
              core_resolution:{meta:$report[0].core_resolution.meta,project:$report[0].core_resolution.project,identity_match:$report[0].core_resolution.identity_match},
              repository:{before_digest:$before,after_digest:$after,writes:$writes},
              deterministic_replay:true,captured_external_profiles:1,independent_public_consumers:0,
              core_lock_schema_variants:2,core_lock_structure_variants:["flat","nested"],
              core_lock_asset_counts:[1,8,8],
              core_lock_digest_vocabularies:["sha256","digest"],
              local_tests_run:0}' > "$RUNNER_TEMP/runtime.json"
          jq -e '.repository.writes==0 and .repository.before_digest==.repository.after_digest and .deterministic_replay==true and .local_tests_run==0' "$RUNNER_TEMP/runtime.json" >/dev/null

          {
            echo '## Gooo evidence generator'
            jq -r '"- generation: \(.summary.closed)/\(.summary.total) CLOSED; UNKNOWN \(.summary.unknown); REFUTED \(.summary.refuted)",
              "- patterns: \(.patterns.promoted)/\(.patterns.observed) promoted; without meta \(.patterns.excluded_without_meta)",
              "- generated files: \(.summary.expected_output_files)",
              "- README readiness authority: \(.authority.root_readme_readiness)"' "$RUNNER_TEMP/complete-a/generation-report.json"
            jq -r '"- missing activity: direct \(.summary.direct_missing); dependency blocked \(.summary.dependency_blocked); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/missing-activity/generation-report.json"
            jq -r '"- duplicate activity: refuted \(.summary.refuted); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/duplicate-activity/generation-report.json"
            jq -r '"- core resolutions: meta \(.core_resolution.meta.closed)/\(.core_resolution.meta.required); project \(.core_resolution.project.closed)/\(.core_resolution.project.required)"' "$RUNNER_TEMP/complete-a/generation-report.json"
            jq -r '"- missing core receipt: UNKNOWN \(.summary.unknown); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/missing-core-receipt/generation-report.json"
            jq -r '"- invalid core decision: REFUTED \(.summary.refuted); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/invalid-core-decision/generation-report.json"
            jq -r '"- mismatched core identities: \(.core_resolution.identity_match); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/core-identity-mismatch/generation-report.json"
            jq -r '"- missing identity anchor: \(.core_resolution.identity_anchor_count); cells \(.summary.closed)/\(.summary.total) CLOSED; REFUTED \(.summary.refuted)"' "$RUNNER_TEMP/missing-core-identity-anchor/generation-report.json"
            jq -r '"- missing meta activity: required UNKNOWN \(.patterns.unknown_required); cells \(.summary.closed)/\(.summary.total) CLOSED; first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/missing-meta-activity/generation-report.json"
            jq -r '"- unbound required pattern: \(.patterns.missing_required); \(.claim.reason)"' "$RUNNER_TEMP/unbound-pattern/generation-report.json"
            jq -r '"- captured external profile: \(.summary.closed)/\(.summary.total) CLOSED; meta nodes \(.summary.meta_activity_nodes); project nodes \(.summary.project_activity_nodes)"' "$RUNNER_TEMP/external-a/generation-report.json"
            jq -r '"- external core identity mismatch: \(.summary.closed)/\(.summary.total) CLOSED; REFUTED \(.summary.refuted); anchor \(.core_resolution.identity_anchor_count)"' "$RUNNER_TEMP/external-core-identity-mismatch/generation-report.json"
            jq -r '"- consumer core lock: \(.summary.closed)/\(.summary.total) CLOSED; patterns \(.patterns.promoted)"' "$RUNNER_TEMP/compatible-core-lock/generation-report.json"
            jq -r '"- nested consumer core lock: \(.summary.closed)/\(.summary.total) CLOSED; patterns \(.patterns.promoted)"' "$RUNNER_TEMP/nested-core-lock/generation-report.json"
            jq -r '"- generated digest verification: \(.summary.closed)/\(.summary.total); REFUTED \(.summary.refuted)"' "$RUNNER_TEMP/drift-verification.json"
            jq -r '"- repository writes: \(.repository.writes)","- deterministic replay: \(.deterministic_replay)","- local test executions: \(.local_tests_run)","- observed peak RSS: \(.generator.peak_rss_kib) KiB","- observed wall time: \(.generator.wall_ms) ms"' "$RUNNER_TEMP/runtime.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidence-generator-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/complete-a
            ${{ runner.temp }}/complete-b
            ${{ runner.temp }}/missing-activity
            ${{ runner.temp }}/duplicate-activity
            ${{ runner.temp }}/missing-core-receipt
            ${{ runner.temp }}/invalid-core-decision
            ${{ runner.temp }}/core-identity-mismatch
            ${{ runner.temp }}/missing-core-identity-anchor
            ${{ runner.temp }}/missing-meta-activity
            ${{ runner.temp }}/unbound-pattern
            ${{ runner.temp }}/external-a
            ${{ runner.temp }}/external-b
            ${{ runner.temp }}/external-verification.json
            ${{ runner.temp }}/external-core-identity-mismatch
            ${{ runner.temp }}/compatible-core-lock
            ${{ runner.temp }}/compatible-core-lock-verification.json
            ${{ runner.temp }}/nested-core-lock
            ${{ runner.temp }}/nested-core-lock-verification.json
            ${{ runner.temp }}/verification.json
            ${{ runner.temp }}/drift-verification.json
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/version.json
            ${{ runner.temp }}/syntax.json
            ${{ runner.temp }}/semantic.json
            ${{ runner.temp }}/graph.json
            ${{ runner.temp }}/external-graph.json
            ${{ runner.temp }}/resolved-meta-graph.json
            ${{ runner.temp }}/resolved-project-graph.json
            ${{ runner.temp }}/resolved-external-graph.json

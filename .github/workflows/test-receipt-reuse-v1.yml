name: Exact test receipt reuse v1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-receipt-reuse:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Bind exact subject and read-only repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "SUBJECT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          snapshot > "$RUNNER_TEMP/repository-before"

      - name: Acquire pinned released Gooo
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/core-release-lock-v1.json
          tag=$(jq -r '.tag' "$lock")
          expected_tag_object=$(jq -r '.tag_object_sha' "$lock")
          expected_target=$(jq -r '.target_commit_sha' "$lock")
          asset_name=$(jq -r '.assets[0].name' "$lock")
          expected_digest=$(jq -r '.assets[0].sha256' "$lock")

          gh api "repos/kimjooyoon/meta-ontology-go/git/ref/tags/$tag" > "$RUNNER_TEMP/tag-ref.json"
          jq -e --arg sha "$expected_tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/tag-ref.json" >/dev/null
          gh api "repos/kimjooyoon/meta-ontology-go/git/tags/$expected_tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq -e --arg sha "$expected_target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/tag-object.json" >/dev/null
          gh api "repos/kimjooyoon/meta-ontology-go/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          asset_id=$(jq -r --arg name "$asset_name" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/release.json")
          test -n "$asset_id"
          archive="$RUNNER_TEMP/$asset_name"
          gh api -H 'Accept: application/octet-stream' "repos/kimjooyoon/meta-ontology-go/releases/assets/$asset_id" > "$archive"
          printf '%s  %s\n' "$expected_digest" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gooo"
          echo "GOOO_BIN=$RUNNER_TEMP/gooo" >> "$GITHUB_ENV"

      - name: Bind twelve released test receipt activities
        shell: bash
        run: |
          set -euo pipefail
          source_file=examples/test-receipt-reuse/main.gooo
          "$GOOO_BIN" version --json > "$RUNNER_TEMP/version.json"
          "$GOOO_BIN" check --json "$source_file" > "$RUNNER_TEMP/syntax.json"
          "$GOOO_BIN" check --semantic --json "$source_file" > "$RUNNER_TEMP/semantic.json"
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/graph-rss" \
            "$GOOO_BIN" graph dump "$source_file" > "$RUNNER_TEMP/graph.json"
          jq -e '.schema_version=="gooo-version/v1" and .language=="gooo"' "$RUNNER_TEMP/version.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok"' "$RUNNER_TEMP/syntax.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok" and .semantic_hash!=null' "$RUNNER_TEMP/semantic.json" >/dev/null
          jq -e '.schema_version=="gooo-graph/v1"' "$RUNNER_TEMP/graph.json" >/dev/null

          jq -S '{schema:"gooo/evidence-generator/activity-selector-set/v1",role:"project_graph",
            selectors:[.cells[]|{ordinal,id,activity,selector:{name:.activity}}]}' \
            contracts/test-receipt-reuse-denominator-v1.json > "$RUNNER_TEMP/test-receipt-selectors.json"
          bash scripts/bind-activity-resolutions.sh \
            "$GOOO_BIN" "$source_file" "$RUNNER_TEMP/graph.json" \
            "$RUNNER_TEMP/test-receipt-selectors.json" contracts/core-release-lock-v1.json \
            "$RUNNER_TEMP/resolved-activities.json" project_graph
          jq -e '.activity_resolution_observation.summary=={expected:12,observed:12,closed:12,unknown:0,refuted:0,unique_selectors:12}' "$RUNNER_TEMP/resolved-activities.json" >/dev/null

      - name: Execute one producer test and publish its exact receipt
        shell: bash
        run: |
          set -euo pipefail
          source_file=examples/test-receipt-reuse/main.gooo
          source_digest=$(sha256sum "$source_file" | awk '{print $1}')
          binary_digest=$(sha256sum "$GOOO_BIN" | awk '{print $1}')
          tag=$(jq -r '.tag' contracts/core-release-lock-v1.json)
          target_commit=$(jq -r '.target_commit_sha' contracts/core-release-lock-v1.json)

          jq -S -n \
            --arg observer_subject_sha "$SUBJECT_SHA" \
            --arg source_path "$source_file" \
            --arg source_digest "$source_digest" \
            --arg tag "$tag" \
            --arg target_commit "$target_commit" \
            --arg binary_digest "$binary_digest" '
            {schema:"gooo/evidence-generator/test-scope/v1",observer_subject_sha:$observer_subject_sha,
             scope:{id:"gooo://test-scope/test-receipt-reuse-meta/v1",
               files:[{path:$source_path,sha256:$source_digest}],
               toolchain:{repository:"kimjooyoon/meta-ontology-go",tag:$tag,target_commit_sha:$target_commit,
                 binary_sha256:$binary_digest,platform:"linux-amd64"},
               command:["gooo","check","--semantic","--json",$source_path]}}
          ' > "$RUNNER_TEMP/current-scope.json"

          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/producer-test-rss" \
            "$GOOO_BIN" check --semantic --json "$source_file" > "$RUNNER_TEMP/baseline-test-result.json"
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$RUNNER_TEMP/producer-test-wall-ms"
          jq -e '.schema_version=="gooo/diagnostics/v1" and .status=="ok" and .semantic_hash!=null' "$RUNNER_TEMP/baseline-test-result.json" >/dev/null

          result_digest=$(sha256sum "$RUNNER_TEMP/baseline-test-result.json" | awk '{print $1}')
          semantic_hash=$(jq -r '.semantic_hash' "$RUNNER_TEMP/baseline-test-result.json")
          wall_ms=$(cat "$RUNNER_TEMP/producer-test-wall-ms")
          peak_rss_kib=$(cat "$RUNNER_TEMP/producer-test-rss")
          jq -S -n \
            --arg producer_subject_sha "$SUBJECT_SHA" \
            --arg result_digest "$result_digest" \
            --arg semantic_hash "$semantic_hash" \
            --argjson wall_ms "$wall_ms" \
            --argjson peak_rss_kib "$peak_rss_kib" \
            --slurpfile current "$RUNNER_TEMP/current-scope.json" '
            {schema:"gooo/evidence-generator/test-receipt/v1",producer_subject_sha:$producer_subject_sha,
             scope:$current[0].scope,
             result:{decision:"PASS",exit_code:0,diagnostics_schema:"gooo/diagnostics/v1",status:"ok",
               semantic_hash:$semantic_hash,output_sha256:$result_digest},
             execution:{test_executions:1,wall_ms:$wall_ms,peak_rss_kib:$peak_rss_kib},
             authority:{repository_writes:0,source_mutations:0,local_test_executions:0}}
          ' > "$RUNNER_TEMP/baseline-test-receipt.json"

      - name: Evaluate exact reuse unknown and refuted cases
        shell: bash
        run: |
          set -euo pipefail
          denominator=contracts/test-receipt-reuse-denominator-v1.json
          scope="$RUNNER_TEMP/current-scope.json"
          receipt="$RUNNER_TEMP/baseline-test-receipt.json"
          result="$RUNNER_TEMP/baseline-test-result.json"
          resolution="$RUNNER_TEMP/resolved-activities.json"
          evaluator=scripts/evaluate-test-receipt-reuse-v1.sh
          conformer=scripts/conform-test-receipt-reuse-v1.sh

          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/reuse-evaluator-rss" \
            bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$scope" "$receipt" "$result" "$resolution" \
              "$RUNNER_TEMP/normal-a" "$SUBJECT_SHA" normal
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$RUNNER_TEMP/reuse-evaluator-wall-ms"
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$scope" "$receipt" "$result" "$resolution" \
            "$RUNNER_TEMP/normal-b" "$SUBJECT_SHA" normal
          diff -qr "$RUNNER_TEMP/normal-a" "$RUNNER_TEMP/normal-b"

          mkdir -p "$RUNNER_TEMP/scenarios"
          zeros=$(printf '0%.0s' {1..64})
          jq --arg digest "$zeros" '(.scope.files[0].sha256)=$digest' "$receipt" > "$RUNNER_TEMP/scenarios/stale-receipt.json"
          jq --arg digest "$zeros" '(.scope.files[0].sha256)=$digest | del(.result.semantic_hash)' "$receipt" > "$RUNNER_TEMP/scenarios/mixed-receipt.json"
          jq '(.authority.repository_writes)=1' "$receipt" > "$RUNNER_TEMP/scenarios/authority-receipt.json"
          jq '(.result.decision)="FIXED_POINT"' "$receipt" > "$RUNNER_TEMP/scenarios/unrecognized-decision.json"

          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/missing-receipt.json" "$result" "$resolution" \
            "$RUNNER_TEMP/missing-receipt" "$SUBJECT_SHA" missing-receipt
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/stale-receipt.json" "$result" "$resolution" \
            "$RUNNER_TEMP/stale-scope" "$SUBJECT_SHA" stale-scope
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/mixed-receipt.json" "$result" "$resolution" \
            "$RUNNER_TEMP/refuted-over-unknown" "$SUBJECT_SHA" refuted-over-unknown
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/authority-receipt.json" "$result" "$resolution" \
            "$RUNNER_TEMP/authority-escalation" "$SUBJECT_SHA" authority-escalation
          bash "$evaluator" "$GITHUB_WORKSPACE" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/unrecognized-decision.json" "$result" "$resolution" \
            "$RUNNER_TEMP/unrecognized-decision" "$SUBJECT_SHA" unrecognized-decision

          bash "$conformer" "$RUNNER_TEMP/normal-a" "$denominator" "$scope" "$receipt" "$result" "$resolution" normal "$RUNNER_TEMP/conform-normal-a.json"
          bash "$conformer" "$RUNNER_TEMP/normal-b" "$denominator" "$scope" "$receipt" "$result" "$resolution" normal "$RUNNER_TEMP/conform-normal-b.json"
          bash "$conformer" "$RUNNER_TEMP/missing-receipt" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/missing-receipt.json" "$result" "$resolution" missing-receipt "$RUNNER_TEMP/conform-missing-receipt.json"
          bash "$conformer" "$RUNNER_TEMP/stale-scope" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/stale-receipt.json" "$result" "$resolution" stale-scope "$RUNNER_TEMP/conform-stale-scope.json"
          bash "$conformer" "$RUNNER_TEMP/refuted-over-unknown" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/mixed-receipt.json" "$result" "$resolution" refuted-over-unknown "$RUNNER_TEMP/conform-refuted-over-unknown.json"
          bash "$conformer" "$RUNNER_TEMP/authority-escalation" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/authority-receipt.json" "$result" "$resolution" authority-escalation "$RUNNER_TEMP/conform-authority-escalation.json"
          bash "$conformer" "$RUNNER_TEMP/unrecognized-decision" "$denominator" "$scope" "$RUNNER_TEMP/scenarios/unrecognized-decision.json" "$result" "$resolution" unrecognized-decision "$RUNNER_TEMP/conform-unrecognized-decision.json"

      - name: Record exact runtime inventory and artifact denominator
        shell: bash
        run: |
          set -euo pipefail
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          before=$(cat "$RUNNER_TEMP/repository-before")
          after=$(snapshot)
          if [ "$before" = "$after" ]; then repository_writes=0; else repository_writes=1; fi

          descendant_dirs=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -mindepth 1 -type d -print | wc -l | tr -d ' ')
          regular_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f ! -path "$GITHUB_WORKSPACE/README.md" -print | wc -l | tr -d ' ')
          physical_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f ! -path "$GITHUB_WORKSPACE/README.md" -print0 | sort -z | xargs -0 cat | wc -l | tr -d ' ')
          go_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -print | wc -l | tr -d ' ')
          gooo_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -print | wc -l | tr -d ' ')
          go_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -print0 | sort -z | xargs -0 -r cat | wc -l | tr -d ' ')
          gooo_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -print0 | sort -z | xargs -0 -r cat | wc -l | tr -d ' ')
          language_files=$(
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f \( -name '*.go' -o -name '*.gooo' \) -print0 |
              sort -z | while IFS= read -r -d '' file; do
                relative=${file#"$GITHUB_WORKSPACE"/}
                case "$file" in *.gooo) language=Gooo ;; *) language=Go ;; esac
                jq -cn --arg language "$language" --arg path "$relative" --argjson physical_lines "$(wc -l < "$file" | tr -d ' ')" \
                  '{language:$language,path:$path,physical_lines:$physical_lines}'
              done | jq -s .
          )

          go_version=$(go version | awk '{print $3}')
          producer_wall_ms=$(cat "$RUNNER_TEMP/producer-test-wall-ms")
          producer_peak_rss_kib=$(cat "$RUNNER_TEMP/producer-test-rss")
          evaluator_wall_ms=$(cat "$RUNNER_TEMP/reuse-evaluator-wall-ms")
          evaluator_peak_rss_kib=$(cat "$RUNNER_TEMP/reuse-evaluator-rss")
          graph_peak_rss_kib=$(cat "$RUNNER_TEMP/graph-rss")

          jq -S -n \
            --arg subject_sha "$SUBJECT_SHA" \
            --arg before "$before" \
            --arg after "$after" \
            --arg go_version "$go_version" \
            --argjson repository_writes "$repository_writes" \
            --argjson descendant_dirs "$descendant_dirs" \
            --argjson regular_files "$regular_files" \
            --argjson physical_lines "$physical_lines" \
            --argjson go_files "$go_files" \
            --argjson gooo_files "$gooo_files" \
            --argjson go_lines "$go_lines" \
            --argjson gooo_lines "$gooo_lines" \
            --argjson language_files "$language_files" \
            --argjson producer_wall_ms "$producer_wall_ms" \
            --argjson producer_peak_rss_kib "$producer_peak_rss_kib" \
            --argjson evaluator_wall_ms "$evaluator_wall_ms" \
            --argjson evaluator_peak_rss_kib "$evaluator_peak_rss_kib" \
            --argjson graph_peak_rss_kib "$graph_peak_rss_kib" '
            {schema:"gooo/evidence-generator/test-receipt-reuse-runtime/v1",subject_sha:$subject_sha,
             toolchain:{go:$go_version,go_required:"go1.27.0",released_gooo_reuse:1},
             executions:{gooo_version:1,gooo_syntax_check:1,gooo_meta_semantic_check:1,gooo_graph:1,
               producer_test:1,consumer_test:0,reuse_evaluator:7,conformer:7,
               go_build:0,go_test:0,product_build:0,product_test:0,local_test:0},
             reuse:{producer_test_executions:1,receipt_reuses:1,consumer_test_executions:0,
               exact_scope_pairs:{observed:1,required:1},saved_test_ms:{state:"UNKNOWN",before:$producer_wall_ms,after:null}},
             performance:{producer_test_wall_ms:$producer_wall_ms,producer_test_peak_rss_kib:$producer_peak_rss_kib,
               reuse_evaluator_wall_ms:$evaluator_wall_ms,reuse_evaluator_peak_rss_kib:$evaluator_peak_rss_kib,
               gooo_graph_peak_rss_kib:$graph_peak_rss_kib},
             inventory:{root_readme_policy:"EXCLUDED",input_descendant_dirs:$descendant_dirs,
               input_regular_files:$regular_files,input_physical_lines:$physical_lines,
               input_go_files:$go_files,input_go_physical_lines:$go_lines,
               input_gooo_files:$gooo_files,input_gooo_physical_lines:$gooo_lines,language_files:$language_files},
             repository:{before_digest:$before,after_digest:$after,writes:$repository_writes},
             cases:{normal:1,unknown:1,refuted:4,normal_replay_runs:2},
             improvement:{receipt_reuse_without_consumer_execution:{state:"CLOSED",observed:1,required:1},
               generalized_cross_run_consumer:{state:"UNKNOWN",observed:0,required:1},
               external_user_utility:{state:"UNKNOWN",observed:0,required:1}},
             artifacts:{evaluator_outputs:28,conformer_reports:7,runtime_receipts:1,released_meta_receipts:5,
               producer_receipts:3,total:44}}
          ' > "$RUNNER_TEMP/runtime.json"

          jq -e '.toolchain.go=="go1.27.0" and .repository.writes==0 and .executions.consumer_test==0 and .executions.go_build==0 and .executions.go_test==0 and .executions.local_test==0 and .artifacts.total==44' "$RUNNER_TEMP/runtime.json" >/dev/null

          artifact_files=$(
            find "$RUNNER_TEMP/normal-a" "$RUNNER_TEMP/normal-b" "$RUNNER_TEMP/missing-receipt" "$RUNNER_TEMP/stale-scope" "$RUNNER_TEMP/refuted-over-unknown" "$RUNNER_TEMP/authority-escalation" "$RUNNER_TEMP/unrecognized-decision" -type f
            printf '%s\n' "$RUNNER_TEMP/conform-normal-a.json" "$RUNNER_TEMP/conform-normal-b.json" "$RUNNER_TEMP/conform-missing-receipt.json" "$RUNNER_TEMP/conform-stale-scope.json" "$RUNNER_TEMP/conform-refuted-over-unknown.json" "$RUNNER_TEMP/conform-authority-escalation.json" "$RUNNER_TEMP/conform-unrecognized-decision.json" "$RUNNER_TEMP/runtime.json" "$RUNNER_TEMP/version.json" "$RUNNER_TEMP/syntax.json" "$RUNNER_TEMP/semantic.json" "$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/resolved-activities.json" "$RUNNER_TEMP/current-scope.json" "$RUNNER_TEMP/baseline-test-receipt.json" "$RUNNER_TEMP/baseline-test-result.json"
          )
          test "$(printf '%s\n' "$artifact_files" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 44

          {
            echo '## Exact test receipt reuse v1'
            jq -r '"- process: \(.summary.closed)/\(.summary.total) CLOSED; UNKNOWN \(.summary.unknown); REFUTED \(.summary.refuted)",
              "- producer tests / receipt reuses / consumer tests: \(.reuse.producer_test_executions)/\(.reuse.receipt_reuses)/\(.reuse.consumer_test_executions)",
              "- exact scope pairs: \(.reuse.exact_scope_pairs)/\(.reuse.required_scope_pairs)",
              "- saved test milliseconds: \(.improvement.saved_test_ms.state)",
              "- external utility: \(.external_utility.observed)/\(.external_utility.required) \(.external_utility.state)"' "$RUNNER_TEMP/normal-a/reuse-report.json"
            jq -r '"- cases: normal \(.cases.normal); UNKNOWN \(.cases.unknown); REFUTED \(.cases.refuted)",
              "- producer test: \(.performance.producer_test_wall_ms) ms; \(.performance.producer_test_peak_rss_kib) KiB peak RSS",
              "- reuse evaluator: \(.performance.reuse_evaluator_wall_ms) ms; \(.performance.reuse_evaluator_peak_rss_kib) KiB peak RSS",
              "- inventory: Go \(.inventory.input_go_files) files / \(.inventory.input_go_physical_lines) lines; Gooo \(.inventory.input_gooo_files) files / \(.inventory.input_gooo_physical_lines) lines",
              "- tree: \(.inventory.input_regular_files) files; \(.inventory.input_descendant_dirs) descendant directories; root README \(.inventory.root_readme_policy)",
              "- artifact files: \(.artifacts.total)",
              "- repository writes: \(.repository.writes)"' "$RUNNER_TEMP/runtime.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce zero source-repository writes
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.repository.writes==0 and .repository.before_digest==.repository.after_digest' "$RUNNER_TEMP/runtime.json" >/dev/null

      - name: Upload exact test receipt reuse evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-receipt-reuse-v1-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/normal-a
            ${{ runner.temp }}/normal-b
            ${{ runner.temp }}/missing-receipt
            ${{ runner.temp }}/stale-scope
            ${{ runner.temp }}/refuted-over-unknown
            ${{ runner.temp }}/authority-escalation
            ${{ runner.temp }}/unrecognized-decision
            ${{ runner.temp }}/conform-normal-a.json
            ${{ runner.temp }}/conform-normal-b.json
            ${{ runner.temp }}/conform-missing-receipt.json
            ${{ runner.temp }}/conform-stale-scope.json
            ${{ runner.temp }}/conform-refuted-over-unknown.json
            ${{ runner.temp }}/conform-authority-escalation.json
            ${{ runner.temp }}/conform-unrecognized-decision.json
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/version.json
            ${{ runner.temp }}/syntax.json
            ${{ runner.temp }}/semantic.json
            ${{ runner.temp }}/graph.json
            ${{ runner.temp }}/resolved-activities.json
            ${{ runner.temp }}/current-scope.json
            ${{ runner.temp }}/baseline-test-receipt.json
            ${{ runner.temp }}/baseline-test-result.json
